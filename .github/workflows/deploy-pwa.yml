name: Deploy PWA to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --pwa-strategy=none --base-href /
      - run: node --check web/app_service_worker.js
      - run: node tool/verify_pwa.mjs build/web
      - run: node tool/prepare_vercel_output.mjs build/web
      - name: Deploy to Vercel Production
        run: npx --yes --package vercel@60.1.3 vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
